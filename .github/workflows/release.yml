name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allows manual run too

permissions:
  contents: write

jobs:
  build:
    name: zipify
    runs-on: ubuntu-latest
    container:
      image: fozztexx/defoogi:1.4.4

    steps:
      - uses: actions/checkout@v4

      - name: Set version string
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
            echo "VERSION_STRING=${version#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_STRING=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: Build release files
        run: make release

      - name: Upload release folder for next job
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

  tagged-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Generate random release name
        id: random_name
        shell: bash
        run: |
          # Fetch the raw text contents securely via the GitHub API/CLI
          gh api repos/fnichol/names/contents/data/adjectives.txt --jq '.content' | base64 -d > adjectives.txt
          gh api repos/fnichol/names/contents/data/animals.txt --jq '.content' | base64 -d > nouns.txt

          # Select a random line from each file
          adj=$(shuf -n 1 adjectives.txt | tr -d '\r\n[:space:]')
          noun=$(shuf -n 1 nouns.txt | tr -d '\r\n[:space:]')

          RANDOM_NAME=$(echo "${adj}-${noun}" | tr '[:upper:]' '[:lower:]')

          echo "name=$RANDOM_NAME" >> $GITHUB_OUTPUT
          echo "Generated release name: $RANDOM_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.random_name.outputs.name }} (${{ github.ref_name }})
          draft: false
          prerelease: false
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
